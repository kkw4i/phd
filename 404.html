<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 · Project Y</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:rgb(253,253,255);--paper:rgb(250,250,200);--ink:rgb(41,41,41);--ink-2:rgb(67,67,67);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bg);font-family:'Roboto Mono',ui-monospace,Menlo,monospace;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;text-align:center;overflow:hidden}
.wrap{display:grid;gap:18px;justify-items:center;position:relative;z-index:1}
.code{font-weight:700;font-size:clamp(96px,28vw,260px);line-height:.9;letter-spacing:-.06em;color:var(--paper)}
.code span{display:inline-block;animation:drift 6s ease-in-out infinite}
.code span:nth-child(2){animation-delay:-2s}.code span:nth-child(3){animation-delay:-4s}
@keyframes drift{50%{transform:translateY(-6px)}}
h1{margin:0;font-size:clamp(15px,2vw,20px);font-weight:500;opacity:.85}
p{margin:0;font-size:13px;opacity:.6;max-width:40ch;line-height:1.7}
a.btn{margin-top:8px;display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--paper);font-weight:500;letter-spacing:.06em;font-size:13.5px;padding:12px 22px;border-radius:12px}
a.btn:hover{background:#f3f3b8}
a.btn:focus-visible{outline:2px solid var(--bg);outline-offset:3px}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.55}
.glow{position:fixed;inset:auto;width:60vmax;height:60vmax;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(250,250,200,.14),transparent 65%);filter:blur(40px);pointer-events:none}
@media (prefers-reduced-motion:reduce){.code span{animation:none}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="wrap">
  <p class="eyebrow">Reamnoream™</p>
  <div class="code" aria-label="404"><span>4</span><span>0</span><span>4</span></div>
  <h1>That page is gone — this one isn't.</h1>
  <p>Wrong turn, old link, or a chapter that hasn't been written yet.</p>
  <a class="btn" href="/">← Back to Project Y</a>
</main>
</body>
</html>
